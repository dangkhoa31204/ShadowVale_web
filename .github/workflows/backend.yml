name: Backend

on:
  push:
    branches: [main, dev]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/shadowvale_be

    # Throwaway database for the integration tests (they truncate every table)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadowvale_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SHADOWVALE_TEST_DB: Host=localhost;Port=5432;Database=shadowvale_test;Username=postgres;Password=postgres
      DOTNET_NOLOGO: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      # CI=true is set by GitHub, so integration tests fail (instead of skipping) if the database is unreachable
      - run: >-
          dotnet test --no-build -c Release
          --logger trx
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      # Test results (.trx) and coverage (Cobertura) for the "Testing Strategy & Results" document
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/shadowvale_be/TestResults
