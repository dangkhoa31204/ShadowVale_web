name: Backend

on:
  push:
    branches: [main, dev]
    paths: ['backend/**', '.github/workflows/backend.yml', '.github/scripts/deploy-render.sh', '.github/tests/**']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml', '.github/scripts/deploy-render.sh', '.github/tests/**']

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/shadowvale_be

    # Throwaway database for the integration tests (they truncate every table)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadowvale_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SHADOWVALE_TEST_DB: Host=localhost;Port=5432;Database=shadowvale_test;Username=postgres;Password=postgres
      DOTNET_NOLOGO: true

    steps:
      - uses: actions/checkout@v4

      - name: Check CD safety without calling Render
        run: bash "$GITHUB_WORKSPACE/.github/tests/deploy-render.test.sh"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      # The build regenerates docs/openapi.json; it must match what is committed
      - name: Check docs/openapi.json is up to date
        run: git diff --exit-code -- docs/openapi.json || (echo "::error::docs/openapi.json is out of date. Build locally and commit it." && exit 1)

      # CI=true is set by GitHub, so integration tests fail (instead of skipping) if the database is unreachable
      - run: >-
          dotnet test --no-build -c Release
          --logger trx
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      # Test results (.trx) and coverage (Cobertura) for the "Testing Strategy & Results" document
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/shadowvale_be/TestResults

  deploy:
    name: Deploy BE to Render
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Trigger tested commit deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_BE_DEPLOY_HOOK }}
          RENDER_COMPONENT: backend
        run: bash .github/scripts/deploy-render.sh
